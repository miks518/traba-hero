<svg 
  width="400" 
  height="400" 
  viewBox="0 0 400 400" 
  fill="none" 
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Background Base -->
  <rect width="400" height="400" fill="#EAEAEA" />

  <!-- Shield Outer Frame -->
  <path 
    d="M 200 28 Q 280 62 355 72 C 355 235 295 335 200 380 C 105 335 45 235 45 72 Q 120 62 200 28 Z" 
    fill="none" 
    stroke="#353D46" 
    stroke-width="22" 
    stroke-linejoin="round"
  />

  <!-- Briefcase Main Body -->
  <rect 
    x="105" 
    y="130" 
    width="190" 
    height="120" 
    rx="18" 
    fill="#353D46" 
  />

  <!-- Vertical Strap Cutouts -->
  <rect x="136" y="130" width="10" height="120" fill="#EAEAEA" />
  <rect x="254" y="130" width="10" height="120" fill="#EAEAEA" />

  <!-- NEW SMALLER, CENTERED Briefcase Handle -->
  <!-- 
       Handle size reduced from ~118px wide to ~78px wide. 
       Handle height reduced from ~40px tall to ~30px tall. 
       This handle is now significantly smaller and centered, 
       sitting neatly between the vertical lines.
  -->
  <path 
    d="M 166 130 V 110 C 166 101.7 172.7 95 181 95 H 219 C 227.3 95 234 101.7 234 110 V 130" 
    stroke="#353D46" 
    stroke-width="12" 
    stroke-linecap="square"
    fill="none"
  />

  <!-- Magnifying Glass White Clearance Halo Cutout -->
  <circle cx="255" cy="255" r="58" fill="#EAEAEA" />
  <path 
    d="M 292 292 L 350 350" 
    stroke="#EAEAEA" 
    stroke-width="36" 
    stroke-linecap="round" 
  />

  <!-- Magnifying Glass Lens & Handle -->
  <circle 
    cx="255" 
    cy="255" 
    r="44" 
    fill="#EAEAEA" 
    stroke="#353D46" 
    stroke-width="18" 
  />
  <path 
    d="M 292 292 L 348 348" 
    stroke="#353D46" 
    stroke-width="22" 
    stroke-linecap="round" 
  />
</svg>
